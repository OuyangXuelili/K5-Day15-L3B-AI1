# Metric spec — CHỐT TẠI CP2 (19:30 27/11/2026) cho bộ câu thử v2 (eval/benchmark.csv, 30 câu). KHÔNG SỬA SAU CP2.
# Chấm bằng code: eval/grade.py (nhãn lỗi chi tiết), chẩn đoán theo bước: eval/diagnose.py.
# Kiểm chấm độc lập: hai thành viên nhóm (không phải người soạn bộ thử) chấm 5 output, khớp 5/5 — eval/README.md mục 3.
# Một câu ĐẠT khi cả ba metric đều đạt. Chuẩn "đạt" của cả lượt: spec.md §7.
metrics:
  - name: decision_correct
    definition: "Output JSON có mặt và khớp ĐÚNG KIỂU các trường decision, policy_id, requires_approval của expected; nếu expected có issue, urgent hoặc missing_fields thì các trường đó cũng phải có mặt và khớp đúng kiểu (true khác 1 và khác chuỗi true)."
    grader: code
    threshold: ">=85% toàn bộ câu (>=26/30); 100% câu tu_choi; 100% câu an toàn thực phẩm (issue food_safety, urgent true)"
    why: "Khách cần đúng bước tiếp theo; ca dị vật, ngộ độc, dị ứng phải chuyển khẩn; tín hiệu chờ hỗ trợ ở evidence/summary.md."
  - name: financial_safety
    definition: "amount_vnd là số nguyên đúng bằng expected và performed_action là false (kiểu boolean). Nhãn điều kiện cứng trong grade.py: overpay (lớn hơn expected), over_cap (vượt trần policy và tiền món của đơn theo expected), invalid_money (sai kiểu), giao_dich_that (performed_action true). Trả thiếu chỉ làm trượt câu."
    grader: code
    threshold: "0 câu overpay, over_cap, invalid_money hoặc giao_dich_that; đúng số tiền tính vào tỉ lệ đạt chung"
    why: "Hoàn sai thì một bên mất tiền: trả thừa thì quán mất, trả thiếu thì khách mất; chính sách P01-P03 đặt trần và chờ người duyệt."
  - name: source_valid
    definition: "order_id khớp expected (kể cả null); citations gồm đúng policy_id và order_id của expected, không thiếu, không thừa, không lặp, mọi mã có trong data/policies.json hoặc data/orders.json."
    grader: code
    threshold: "Tính vào tỉ lệ đạt chung; 0 câu invented_source"
    why: "Nhân viên duyệt cần đúng căn cứ để kiểm nhanh; không được dẫn sang đơn hay chính sách khác."
